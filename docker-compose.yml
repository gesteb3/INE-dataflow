services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ine-dataflow-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ine_dataflow}:${POSTGRES_PASSWORD:-ine_dataflow_dev}@db:5432/${POSTGRES_DB:-inedataflow}
      INE_DATAFLOW_JWT_SECRET: ${INE_DATAFLOW_JWT_SECRET:-local-only-change-this-secret}
      INE_DATAFLOW_ACCESS_TOKEN_MINUTES: ${INE_DATAFLOW_ACCESS_TOKEN_MINUTES:-1440}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${INE_DATAFLOW_API_PORT:-8001}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ine-dataflow-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${INE_DATAFLOW_FRONTEND_PORT:-4200}:80"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ine-dataflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inedataflow}
      POSTGRES_USER: ${POSTGRES_USER:-ine_dataflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ine_dataflow_dev}
    ports:
      - "${INE_DATAFLOW_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ine_dataflow} -d ${POSTGRES_DB:-inedataflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
