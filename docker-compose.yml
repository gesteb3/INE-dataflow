services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ine-dataflow-api
    ports:
      - "${INE_DATAFLOW_API_PORT:-8001}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
